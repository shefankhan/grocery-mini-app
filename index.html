<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 10px;
    }

    .search {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 16px;
    }

    .product {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .product h3 {
      margin: 0 0 6px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .cart {
      position: fixed;
      bottom: 15px;
      left: 15px;
      right: 15px;
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🛒 Grocery Store</h1>

  <input
    class="search"
    id="search"
    placeholder="Search groceries..."
    oninput="searchProducts()"
  >

  <div id="products"></div>

  <div class="cart" onclick="openCart()">
    🛒 Cart: <span id="cartCount">0</span>
  </div>

<script>
const products = [
  {name: "🥛 Milk 1L", price: 60},
  {name: "🍞 Bread", price: 40},
  {name: "🥚 Eggs 6 pcs", price: 55},
  {name: "🍚 Rice 5kg", price: 350},
  {name: "🥔 Potato 1kg", price: 35},
  {name: "🍅 Tomato 1kg", price: 40},
  {name: "🍎 Apple 1kg", price: 150},
  {name: "🍌 Banana 1 dozen", price: 60}
];

let cart = [];

function showProducts(list = products) {
  const container = document.getElementById("products");
  container.innerHTML = "";

  list.forEach((product, index) => {
    container.innerHTML += `
      <div class="product">
        <h3>${product.name}</h3>
        <div class="price">₹${product.price}</div>
        <button onclick="addToCart(${index})">
          ➕ Add to Cart
        </button>
      </div>
    `;
  });
}

function addToCart(index) {
  cart.push(products[index]);
  document.getElementById("cartCount").innerText = cart.length;
}

function searchProducts() {
  const query = document.getElementById("search").value.toLowerCase();

  const filtered = products.filter(product =>
    product.name.toLowerCase().includes(query)
  );

  showProducts(filtered);
}

function openCart() {
  if (cart.length === 0) {
    alert("Cart empty hai 🛒");
    return;
  }

  let total = cart.reduce((sum, item) => sum + item.price, 0);

  alert(
    "Cart items: " + cart.length +
    "\\nTotal: ₹" + total
  );
}

showProducts();
</script>

</body>
</html>
