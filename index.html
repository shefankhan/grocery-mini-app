<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Store</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
    }

    h2 {
      margin-top: 5px;
    }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .search button {
      background: #0a8f3d;
      color: white;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .product img {
      width: 85px;
      height: 85px;
      object-fit: contain;
    }

    .info {
      flex: 1;
    }

    .name {
      font-weight: bold;
      font-size: 15px;
    }

    .brand {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    .price {
      margin-top: 7px;
      font-weight: bold;
    }

    .old {
      text-decoration: line-through;
      color: #999;
      margin-left: 6px;
      font-weight: normal;
    }

    .add {
      background: #0a8f3d;
      color: white;
      margin-top: 8px;
    }

    .cartBar {
      position: fixed;
      bottom: 15px;
      left: 15px;
      right: 15px;
      background: #0a8f3d;
      color: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }

    #products {
      padding-bottom: 80px;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .cartItem {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .cartName {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty button {
      background: #eee;
      font-size: 18px;
      width: 38px;
      height: 38px;
      padding: 0;
    }

    .total {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .checkout {
      width: 100%;
      margin-top: 12px;
      background: #0a8f3d;
      color: white;
      font-size: 17px;
      padding: 15px;
    }

    .back {
      background: #ddd;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div id="app">

  <h2>🛒 Grocery Store</h2>

  <div class="search">
    <input
      id="searchInput"
      placeholder="Search milk, bread, rice..."
    >
    <button onclick="searchProducts()">Search</button>
  </div>

  <div id="products">
    <div class="loading">
      Search for a product 🔎
    </div>
  </div>

</div>

<div
  class="cartBar"
  onclick="showCart()"
>
  🛒 Cart:
  <span id="cartCount">0</span>
  items
</div>


<script>

const tg = window.Telegram.WebApp;

tg.expand();

const API =
  "https://grocery-backend-qhoe.onrender.com/search";

let cart = [];


async function searchProducts() {

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim();

  if (!query) {

    alert("Product name enter karo");

    return;
  }

  const container =
    document.getElementById("products");

  container.innerHTML =
    '<div class="loading">Searching... 🔎</div>';

  try {

    const url =
      API +
      "?q=" +
      encodeURIComponent(query) +
      "&lat=23.2599" +
      "&lon=77.4126";

    const response =
      await fetch(url);

    const data =
      await response.json();

    let products = [];

    if (Array.isArray(data.products)) {

      products = data.products;

    } else if (
      data.data &&
      Array.isArray(data.data.products)
    ) {

      products = data.data.products;
    }

    if (products.length === 0) {

      container.innerHTML =
        '<div class="loading">Product nahi mila 😔</div>';

      return;
    }

    container.innerHTML = "";

    products.forEach(product => {

      const div =
        document.createElement("div");

      div.className =
        "product";

      const image =
        product.images &&
        product.images.length
        ? product.images[0]
        : "";

      div.innerHTML = `

        <img
          src="${image}"
          onerror="this.style.display='none'"
        >

        <div class="info">

          <div class="name">
            ${product.name || ""}
          </div>

          <div class="brand">
            ${product.brand || ""}
          </div>

          <small>
            ${product.quantity || ""}
          </small>

          <div class="price">

            ₹${product.offer_price || product.mrp}

            ${
              product.mrp &&
              product.mrp != product.offer_price
              ? `<span class="old">
                   ₹${product.mrp}
                 </span>`
              : ""
            }

          </div>

          <button
            class="add"
            onclick='addToCart(${JSON.stringify(product)})'
          >
            Add
          </button>

        </div>
      `;

      container.appendChild(div);

    });

  } catch (error) {

    container.innerHTML =
      '<div class="loading">' +
      'Connection error ❌' +
      '</div>';

    console.log(error);
  }
}


function addToCart(product) {

  const existing =
    cart.find(
      item => item.id === product.id
    );

  if (existing) {

    existing.qty++;

  } else {

    cart.push({

      id: product.id,

      name: product.name,

      price:
        Number(
          product.offer_price ||
          product.mrp ||
          0
        ),

      qty: 1,

      deeplink:
        product.deeplink || ""

    });
  }

  updateCart();

}


function updateCart() {

  const count =
    cart.reduce(
      (total, item) =>
        total + item.qty,
      0
    );

  document
    .getElementById("cartCount")
    .innerText = count;
}


function showCart() {

  const app =
    document.getElementById("app");

  if (cart.length === 0) {

    alert("Cart empty hai 🛒");

    return;
  }

  let html = `

    <button
      class="back"
      onclick="goBack()"
    >
      ← Back to Products
    </button>

    <h2>🛒 Your Cart</h2>

  `;

  let total = 0;

  cart.forEach((item, index) => {

    const amount =
      item.price * item.qty;

    total += amount;

    html += `

      <div class="cartItem">

        <div class="cartName">
          ${item.name}
        </div>

        <div>
          ₹${item.price}
        </div>

        <div class="qty">

          <button
            onclick="changeQty(${index}, -1)"
          >
            −
          </button>

          <strong>
            ${item.qty}
          </strong>

          <button
            onclick="changeQty(${index}, 1)"
          >
            +
          </button>

        </div>

        <div style="margin-top:8px;">
          Item total:
          <strong>
            ₹${amount.toFixed(2)}
          </strong>
        </div>

      </div>

    `;
  });

  html += `

    <div class="total">

      Total:
      ₹${total.toFixed(2)}

    </div>

    <button
      class="checkout"
      onclick="checkout()"
    >
      Proceed to Checkout →
    </button>

  `;

  app.innerHTML = html;

}


function changeQty(index, change) {

  cart[index].qty += change;

  if (cart[index].qty <= 0) {

    cart.splice(index, 1);
  }

  updateCart();

  showCart();

}


function goBack() {

  location.reload();

}


function checkout() {

  alert(
    "Checkout next step me banayenge 🚀"
  );

}

</script>

</body>
</html>
