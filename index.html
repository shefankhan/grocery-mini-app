<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Store</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#0c8f3d;
  color:white;
  padding:16px;
  font-size:22px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:10;
}

.search{
  padding:12px;
  background:white;
}

.search input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

.products{
  padding:10px;
  padding-bottom:90px;
}

.product{
  background:white;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  display:flex;
  gap:12px;
}

.product img{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:8px;
}

.info{
  flex:1;
}

.brand{
  font-size:12px;
  color:#777;
}

.name{
  font-weight:bold;
  margin:4px 0;
}

.qty{
  font-size:13px;
  color:#666;
}

.price{
  font-weight:bold;
  font-size:18px;
}

.mrp{
  text-decoration:line-through;
  color:#999;
  font-size:13px;
  margin-left:5px;
}

button{
  border:0;
  border-radius:7px;
  padding:9px 13px;
  cursor:pointer;
}

.add{
  background:#0c8f3d;
  color:white;
  margin-top:7px;
}

.cartbar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:12px;
  box-shadow:0 -2px 10px #bbb;
  z-index:20;
}

.cartbtn{
  width:100%;
  background:#0c8f3d;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.screen{
  padding:15px;
  padding-bottom:30px;
}

.back{
  background:#ddd;
  margin-bottom:12px;
}

.card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
}

.cartitem{
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #eee;
  padding:10px 0;
}

.cartitem img{
  width:60px;
  height:60px;
  object-fit:contain;
}

.cartinfo{
  flex:1;
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
}

.controls button{
  background:#e8f5ed;
  color:#087a35;
  font-size:20px;
  width:38px;
  height:38px;
  padding:0;
  font-weight:bold;
}

.total{
  font-size:20px;
  font-weight:bold;
  margin-top:12px;
}

.primary{
  width:100%;
  background:#0c8f3d;
  color:white;
  font-size:17px;
  padding:14px;
  font-weight:bold;
}

input, textarea, select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

label{
  font-weight:bold;
  font-size:14px;
}

.payment{
  border:1px solid #ddd;
  padding:14px;
  border-radius:8px;
  margin:8px 0;
  display:block;
}

.payment input{
  width:auto;
  margin:0 8px 0 0;
}

.success{
  text-align:center;
  padding:30px 10px;
}

.success .icon{
  font-size:65px;
}

.small{
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>🛒 Grocery Store</header>

<div id="app">

  <div class="search">
    <input
      id="searchInput"
      placeholder="Search milk, bread, rice..."
      onkeydown="if(event.key==='Enter') searchProducts()"
    >
  </div>

  <div class="products" id="products">
    <div class="card">
      Search for products 🔎
    </div>
  </div>

</div>

<div class="cartbar">
  <button class="cartbtn" onclick="showCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</div>

<script>

const API =
"https://grocery-backend-qhoe.onrender.com/search";

let cart =
JSON.parse(localStorage.getItem("cart") || "[]");

let currentProducts = [];

updateCartCount();


async function searchProducts(){

  const q =
  document.getElementById("searchInput").value.trim();

  if(!q) return;

  const box =
  document.getElementById("products");

  box.innerHTML =
  '<div class="card">🔄 Products loading...</div>';

  try{

    const response =
    await fetch(
      API +
      "?q=" + encodeURIComponent(q) +
      "&lat=23.2599&lon=77.4126"
    );

    const data =
    await response.json();

    currentProducts =
    data.products ||
    data.data?.products ||
    [];

    if(!currentProducts.length){

      box.innerHTML =
      '<div class="card">❌ Product nahi mila</div>';

      return;
    }

    box.innerHTML =
    currentProducts.map(
      (p,index) => productHTML(p,index)
    ).join("");

  }catch(error){

    console.log(error);

    box.innerHTML =
    '<div class="card">❌ Server error. Thodi der baad try karo.</div>';
  }
}


function productHTML(p,index){

  const image =
  p.image ||
  p.image_url ||
  p.imageUrl ||
  "";

  const name =
  p.name || "Product";

  const brand =
  p.brand || "";

  const quantity =
  p.quantity || "";

  const price =
  p.offer_price ??
  p.offerPrice ??
  p.price ??
  0;

  const mrp =
  p.mrp ?? price;

  return `
  <div class="product">

    <img src="${image}"
         onerror="this.style.display='none'">

    <div class="info">

      <div class="brand">
        ${escapeHTML(brand)}
      </div>

      <div class="name">
        ${escapeHTML(name)}
      </div>

      <div class="qty">
        ${escapeHTML(quantity)}
      </div>

      <div>
        <span class="price">₹${price}</span>
        <span class="mrp">₹${mrp}</span>
      </div>

      <button
        class="add"
        onclick="addToCart(${index})">
        Add
      </button>

    </div>

  </div>
  `;
}


function addToCart(index){

  const p =
  currentProducts[index];

  const id =
  p.id ||
  p.product_id ||
  p.name;

  const existing =
  cart.find(x => x.id == id);

  if(existing){

    existing.qty++;

  }else{

    cart.push({

      id:id,

      name:p.name || "Product",

      brand:p.brand || "",

      image:p.image ||
            p.image_url ||
            p.imageUrl ||
            "",

      quantity:p.quantity || "",

      price:Number(
        p.offer_price ??
        p.offerPrice ??
        p.price ??
        0
      ),

      qty:1

    });

  }

  saveCart();

}


function changeQty(index,change){

  cart[index].qty += change;

  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }

  saveCart();

  showCart();

}


function saveCart(){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  updateCartCount();

}


function updateCartCount(){

  const count =
  cart.reduce(
    (sum,item) => sum + item.qty,
    0
  );

  document.getElementById("cartCount").innerText =
  count;

}


function cartTotal(){

  return cart.reduce(
    (sum,item) =>
    sum + item.price * item.qty,
    0
  );

}


function showCart(){

  if(!cart.length){

    document.getElementById("app").innerHTML = `

      <div class="screen">

        <div class="card">

          <h2>🛒 Your Cart</h2>

          <p>Cart abhi empty hai.</p>

          <button
            class="primary"
            onclick="location.reload()">
            Continue Shopping
          </button>

        </div>

      </div>

    `;

    return;
  }


  document.getElementById("app").innerHTML = `

    <div class="screen">

      <button
        class="back"
        onclick="location.reload()">
        ← Continue Shopping
      </button>

      <div class="card">

        <h2>🛒 Your Cart</h2>

        ${cart.map((item,index)=>`

          <div class="cartitem">

            <img
              src="${item.image}"
              onerror="this.style.display='none'"
            >

            <div class="cartinfo">

              <b>
                ${escapeHTML(item.name)}
              </b>

              <div class="small">
                ${escapeHTML(item.quantity)}
              </div>

              <div>
                ₹${item.price}
              </div>

            </div>

            <div class="controls">

              <button
                onclick="changeQty(${index},-1)">
                −
              </button>

              <strong>
                ${item.qty}
              </strong>

              <button
                onclick="changeQty(${index},1)">
                +
              </button>

            </div>

          </div>

        `).join("")}

        <div class="total">
          Total: ₹${cartTotal().toFixed(2)}
        </div>

      </div>

      <button
        class="primary"
        onclick="showCheckout()">
        Proceed to Checkout →
      </button>

    </div>

  `;

}


function showCheckout(){

  document.getElementById("app").innerHTML = `

    <div class="screen">

      <button
        class="back"
        onclick="showCart()">
        ← Back to Cart
      </button>

      <div class="card">

        <h2>📍 Delivery Address</h2>

        <label>Full Name</label>

        <input
          id="name"
          placeholder="Enter your name"
        >

        <label>Mobile Number</label>

        <input
          id="mobile"
          type="tel"
          maxlength="10"
          placeholder="10 digit mobile number"
        >

        <label>House / Flat / Building</label>

        <input
          id="house"
          placeholder="House no. / Flat no."
        >

        <label>Area / Street</label>

        <input
          id="area"
          placeholder="Area / Street"
        >

        <label>City</label>

        <input
          id="city"
          placeholder="City"
        >

        <label>PIN Code</label>

        <input
          id="pincode"
          type="number"
          maxlength="6"
          placeholder="PIN Code"
        >

      </div>


      <div class="card">

        <h2>💳 Payment Method</h2>

        <label class="payment">

          <input
            type="radio"
            name="payment"
            value="cod"
            checked
          >

          Cash on Delivery

        </label>


        <label class="payment">

          <input
            type="radio"
            name="payment"
            value="upi"
          >

          UPI

        </label>


        <label class="payment">

          <input
            type="radio"
            name="payment"
            value="card"
          >

          Debit / Credit Card

        </label>

      </div>


      <div class="card">

        <h2>📦 Order Summary</h2>

        ${cart.map(item=>`

          <div style="
            display:flex;
            justify-content:space-between;
            margin:8px 0;
          ">

            <span>
              ${escapeHTML(item.name)}
              × ${item.qty}
            </span>

            <b>
              ₹${(
                item.price * item.qty
              ).toFixed(2)}
            </b>

          </div>

        `).join("")}

        <hr>

        <div class="total">
          Total: ₹${cartTotal().toFixed(2)}
        </div>

      </div>


      <button
        class="primary"
        onclick="placeOrder()">

        🛍️ Place Order

      </button>

    </div>

  `;

}


function placeOrder(){

  const name =
  document.getElementById("name")
  .value.trim();

  const mobile =
  document.getElementById("mobile")
  .value.trim();

  const house =
  document.getElementById("house")
  .value.trim();

  const area =
  document.getElementById("area")
  .value.trim();

  const city =
  document.getElementById("city")
  .value.trim();

  const pincode =
  document.getElementById("pincode")
  .value.trim();

  const payment =
  document.querySelector(
    'input[name="payment"]:checked'
  ).value;


  if(
    !name ||
    !mobile ||
    !house ||
    !area ||
    !city ||
    !pincode
  ){

    alert(
      "Please complete delivery address."
    );

    return;
  }


  if(!/^[0-9]{10}$/.test(mobile)){

    alert(
      "Mobile number 10 digits ka hona chahiye."
    );

    return;
  }


  if(!/^[0-9]{6}$/.test(pincode)){

    alert(
      "PIN code 6 digits ka hona chahiye."
    );

    return;
  }


  const orderNumber =
  "GB" +
  Date.now().toString().slice(-8);


  const order = {

    orderNumber:orderNumber,

    customer:{
      name:name,
      mobile:mobile
    },

    address:{
      house:house,
      area:area,
      city:city,
      pincode:pincode
    },

    payment:payment,

    items:cart,

    total:cartTotal(),

    createdAt:
    new Date().toISOString()

  };


  localStorage.setItem(
    "lastOrder",
    JSON.stringify(order)
  );


  cart = [];

  saveCart();

  showSuccess(order);

}


function showSuccess(order){

  document.getElementById("app").innerHTML = `

    <div class="screen">

      <div class="card success">

        <div class="icon">
          ✅
        </div>

        <h1>
          Order Placed!
        </h1>

        <p>
          Thank you
          ${escapeHTML(order.customer.name)}
        </p>

        <h3>
          Order #${order.orderNumber}
        </h3>

        <p>
          Total Amount:
          <b>
            ₹${order.total.toFixed(2)}
          </b>
        </p>

        <p class="small">
          Payment:
          ${paymentName(order.payment)}
        </p>

        <br>

        <button
          class="primary"
          onclick="location.reload()">

          🛒 Continue Shopping

        </button>

      </div>

    </div>

  `;

}


function paymentName(payment){

  if(payment === "cod")
    return "Cash on Delivery";

  if(payment === "upi")
    return "UPI";

  return "Debit / Credit Card";

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
