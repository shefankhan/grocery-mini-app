<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Store</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
    }

    h2 {
      margin-top: 5px;
    }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .search button {
      background: #0a8f3d;
      color: white;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .product img {
      width: 85px;
      height: 85px;
      object-fit: contain;
      border-radius: 8px;
    }

    .info {
      flex: 1;
    }

    .name {
      font-weight: bold;
      font-size: 15px;
    }

    .brand {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    .price {
      margin-top: 7px;
      font-weight: bold;
    }

    .old {
      text-decoration: line-through;
      color: #999;
      margin-left: 6px;
      font-weight: normal;
    }

    .add {
      background: #0a8f3d;
      color: white;
      margin-top: 8px;
    }

    .cart {
      position: fixed;
      bottom: 15px;
      left: 15px;
      right: 15px;
      background: #0a8f3d;
      color: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }

    #products {
      padding-bottom: 80px;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .error {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<h2>🛒 Grocery Store</h2>

<div class="search">
  <input id="searchInput" placeholder="Search milk, bread, rice..." />
  <button onclick="searchProducts()">Search</button>
</div>

<div id="products">
  <div class="loading">Search for a product 🔎</div>
</div>

<div class="cart" onclick="showCart()">
  🛒 Cart: <span id="cartCount">0</span> items
</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

const API = "https://grocery-backend-qhoe.onrender.com/search";

let cart = [];

async function searchProducts() {

  const query = document
    .getElementById("searchInput")
    .value
    .trim();

  if (!query) {
    alert("Product name enter karo");
    return;
  }

  const container = document.getElementById("products");

  container.innerHTML =
    '<div class="loading">Searching... 🔎</div>';

  try {

    const url =
      API +
      "?q=" +
      encodeURIComponent(query) +
      "&lat=23.2599" +
      "&lon=77.4126";

    console.log("API URL:", url);

    const response = await fetch(url);

    console.log("HTTP Status:", response.status);

    const data = await response.json();

    console.log("API Response:", data);

    /*
      API response me products directly mil rahe hain.
      Kuch API responses me products ke andar data bhi ho sakta hai,
      isliye dono possibilities handle kar rahe hain.
    */

    let products = [];

    if (Array.isArray(data.products)) {
      products = data.products;
    }

    else if (
      data.data &&
      Array.isArray(data.data.products)
    ) {
      products = data.data.products;
    }

    console.log("Products found:", products.length);

    if (products.length === 0) {

      container.innerHTML =
        '<div class="error">' +
        'Product nahi mila 😔<br><br>' +
        '<small>API response mila hai, lekin products list empty hai.</small>' +
        '</div>';

      return;
    }

    container.innerHTML = "";

    products.forEach(product => {

      const div = document.createElement("div");

      div.className = "product";

      const image =
        product.images &&
        product.images.length
        ? product.images[0]
        : "";

      const name =
        product.name || "Unknown Product";

      const brand =
        product.brand || "";

      const quantity =
        product.quantity || "";

      const price =
        product.offer_price || product.mrp || "0";

      const mrp =
        product.mrp || "";

      div.innerHTML = `

        <img
          src="${image}"
          onerror="this.style.display='none'"
        >

        <div class="info">

          <div class="name">
            ${name}
          </div>

          <div class="brand">
            ${brand}
          </div>

          <div>
            <small>${quantity}</small>
          </div>

          <div class="price">
            ₹${price}

            ${
              mrp && mrp != price
              ? `<span class="old">₹${mrp}</span>`
              : ""
            }
          </div>

          <button
            class="add"
            onclick='addToCart(${JSON.stringify(product).replace(/'/g, "&apos;")})'
          >
            Add
          </button>

        </div>
      `;

      container.appendChild(div);

    });

  }

  catch (error) {

    console.error("ERROR:", error);

    container.innerHTML =
      '<div class="error">' +
      'API connection error ❌<br><br>' +
      '<small>' +
      error.message +
      '</small>' +
      '</div>';
  }
}


function addToCart(product) {

  const existing =
    cart.find(item => item.id === product.id);

  if (existing) {

    existing.qty++;

  } else {

    cart.push({

      id: product.id,

      name: product.name,

      price: Number(product.offer_price || product.mrp || 0),

      qty: 1,

      deeplink: product.deeplink || ""

    });
  }

  updateCart();

  alert("Added to cart 🛒");

}


function updateCart() {

  const count =
    cart.reduce(
      (total, item) => total + item.qty,
      0
    );

  document.getElementById("cartCount").innerText =
    count;
}


function showCart() {

  if (cart.length === 0) {

    alert("Cart empty hai 🛒");

    return;
  }

  let total = 0;

  let message =
    "🛒 YOUR CART\n\n";

  cart.forEach(item => {

    const amount =
      item.price * item.qty;

    total += amount;

    message +=
      item.name +
      "\nQty: " +
      item.qty +
      " × ₹" +
      item.price +
      "\n\n";
  });

  message +=
    "Total: ₹" +
    total.toFixed(2);

  alert(message);
}

</script>

</body>
</html>
